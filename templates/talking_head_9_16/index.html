<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* @theme:start */
      /* Design: cyber_glass | Theme: cyber_dark | Layout: standard */
      :root {
        --design-slug: "cyber_glass";
        --theme-slug: "cyber_dark";
        --layout-slug: "standard";
        --bg: #070b14;
        --bg-gradient: radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
        --surface: rgba(16, 23, 42, 0.88);
        --surface-elevated: rgba(255, 255, 255, 0.03);
        --border: rgba(56, 189, 248, 0.25);
        --border-strong: rgba(56, 189, 248, 0.65);
        --divider: rgba(255, 255, 255, 0.08);
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --title-gradient: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
        --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --accent-primary: #38bdf8;
        --accent-primary-soft: rgba(56, 189, 248, 0.12);
        --accent-primary-glow: rgba(56, 189, 248, 0.35);
        --accent-secondary: #10b981;
        --accent-secondary-soft: rgba(16, 185, 129, 0.12);
        --accent-tertiary: #c084fc;
        --accent-warning: #fbbf24;
        --accent-danger: #f43f5e;
        --node-fill: #10172a;
        --cable-idle: #1e293b;
        --caption-bg: transparent;
        --caption-text: #f8fafc;
        --caption-active: #38bdf8;
        --caption-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
        --caption-glow: 0 0 16px #38bdf8;
        /* Tokens estructurales de Diseño Macro y Layout */
        --radius-lg: 24px;
        --radius-md: 14px;
        --radius-sm: 8px;
        --border-width: 1px;
        --panel-backdrop: blur(32px) saturate(190%);
        --badge-radius: 999px;
        --stage-padding: 80px 100px;
        --stage-gap: 40px;
        --split-columns: 1fr 1fr;
        --header-align: left;
        --caption-bottom: 220px;
        --caption-size: 52px;
        /* Alias de compatibilidad con plantillas existentes */
        --card: var(--surface);
        --card-bg: var(--surface);
        --panel-bg: var(--surface);
        --border-color: var(--border);
        --card-border: var(--border);
        --panel-border: var(--border);
        --text: var(--text-primary);
        --text-sub: var(--text-muted);
        --text-code: var(--text-secondary);
        --cyan: var(--accent-primary);
        --cyan-glow: var(--accent-primary-glow);
        --green: var(--accent-secondary);
        --purple: var(--accent-tertiary);
        --gold: var(--accent-warning);
        --red: var(--accent-danger);
      }
      /* @theme:end */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        font-family: var(--font-sans);
        color: var(--text-primary);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
      }
      #bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      header {
        position: absolute;
        top: 220px;
        left: 72px;
        right: 72px;
        text-align: center;
      }
      .hook-badge {
        display: inline-block;
        padding: 8px 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--accent-primary);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        border-radius: var(--badge-radius, 8px);
        margin-bottom: 14px;
      }
      .lower-third {
        position: absolute;
        bottom: 520px;
        left: 72px;
        right: 160px;
        background: var(--surface);
        border: var(--border-width, 1px) solid var(--border);
        border-left: 6px solid var(--accent-primary);
        border-radius: var(--radius-md, 14px);
        padding: 24px 32px;
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }
      .lower-third h1 {
        font-size: 34px;
        font-weight: 900;
        margin-bottom: 8px;
        color: var(--text-primary);
      }
      .lower-third p {
        font-size: 20px;
        color: var(--text-secondary);
      }
      #caption-zone {
        position: absolute;
        top: 1440px;
        left: 72px;
        right: 160px;
        text-align: center;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .caption-bar {
        font-size: 46px;
        font-weight: 900;
        line-height: 1.25;
        text-shadow: var(--caption-shadow);
      }
      /* @caption-style:start */
      /* Caption Style: karaoke_glow */
      .caption-phrase {
        display: inline-block;
        background: var(--caption-bg);
        padding: 6px 18px;
        border-radius: var(--radius-md, 12px);
      }
      .word {
        display: inline-block;
        opacity: 0.25;
        color: var(--caption-text);
        margin: 0 4px;
      }
      .word.active {
        opacity: 1;
        color: var(--caption-active);
        text-shadow: var(--caption-glow);
      }
      /* @caption-style:end */
      /* @design-system:start */
      /* Macro Design: cyber_glass | Layout: standard | Chrome: macos_dots */
      .panel, #main-card, #main-window, .node-glass {
        border-radius: var(--radius-lg);
        border: var(--border-width) solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: var(--panel-backdrop);
      }
      .badge, .hook-badge, .sys-badge, .term-badge {
        border-radius: var(--badge-radius);
      }
      .split-stage {
        grid-template-columns: var(--split-columns);
        gap: var(--stage-gap);
      }
      .caption-bar {
        bottom: var(--caption-bottom);
        font-size: var(--caption-size);
      }
      .panel, #main-card, #main-window, .clean-card, .node-glass {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-top: 1.5px solid rgba(255, 255, 255, 0.45);
        border-left: 1.5px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.70), inset 0 1px 1px 0 rgba(255, 255, 255, 0.40);
        backdrop-filter: blur(32px) saturate(190%);
        -webkit-backdrop-filter: blur(32px) saturate(190%);
      }
      .lower-third {
        left: 80px;
        right: auto;
        border-radius: var(--radius-md);
      }
      /* @design-system:end */
    
      /* Capa ambiental de profundidad y volumen luminoso */
      .ambient-lights {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }
      .light-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.55;
        mix-blend-mode: screen;
      }
      .orb-primary {
        width: 650px;
        height: 650px;
        background: radial-gradient(circle, var(--accent-primary-glow) 0%, transparent 70%);
        top: -100px;
        left: -100px;
      }
      .orb-secondary {
        width: 700px;
        height: 700px;
        background: radial-gradient(circle, var(--accent-secondary-soft) 0%, transparent 70%);
        bottom: -150px;
        right: -100px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-caption-style="karaoke_glow"
      data-motion="dynamic"
      data-layout="standard"
      data-style="cyber_dark"
      data-design="cyber_glass"
      data-hold
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <!-- Capa ambiental de profundidad luminosa -->
      <div class="ambient-lights" data-layout-ignore>
        <div class="light-orb orb-primary" id="orb-p"></div>
        <div class="light-orb orb-secondary" id="orb-s"></div>
      </div>

      <video id="bg-video" src="cut.mp4" data-start="0" data-duration="15" muted></video>

      <header id="header">
        <div class="hook-badge" data-layout-ignore>Shorts / Reels / TikTok</div>
      </header>

      <div id="card" class="lower-third">
        <h1 id="card-title">Arquitectura en Producción</h1>
        <p id="card-desc" data-layout-ignore>Explicación técnica sincronizada con voz</p>
      </div>

      <div id="caption-zone">
        <!-- @captions:start -->
        <div id="captions-container" class="caption-bar">
          <div id="cg_0" class="caption-phrase">
            <span id="w1" class="word">Bienvenidos</span>
            <span id="w2" class="word">al</span>
            <span id="w3" class="word">análisis</span>
            <span id="w4" class="word">técnico</span>
          </div>
        </div>
        <!-- @captions:end -->
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#header", { y: -16, duration: 0.8, ease: "power3.out" }, 0.0);
      tl.fromTo("#card", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
      tl.to("#card", { opacity: 0, y: 16, duration: 0.4, ease: "power2.in" }, 5.5);

      // @captions-gsap:start
      tl.to("#w1", { className: "word active", duration: 0.05 }, 1.0);
      tl.to("#w2", { className: "word active", duration: 0.05 }, 1.3);
      tl.to("#w3", { className: "word active", duration: 0.05 }, 1.6);
      tl.to("#w4", { className: "word active", duration: 0.05 }, 1.9);
      // @captions-gsap:end

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
