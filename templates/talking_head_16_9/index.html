<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* @theme:start */
      /* Design: cinematic | Theme: dark_violet | Layout: standard */
      :root {
        --design-slug: "cinematic";
        --theme-slug: "dark_violet";
        --layout-slug: "standard";
        --bg: #09090b;
        --bg-gradient: radial-gradient(circle at 50% 20%, rgba(167, 139, 250, 0.14) 0%, transparent 70%);
        --surface: rgba(24, 24, 27, 0.90);
        --surface-elevated: rgba(255, 255, 255, 0.04);
        --border: rgba(167, 139, 250, 0.26);
        --border-strong: rgba(167, 139, 250, 0.65);
        --divider: rgba(255, 255, 255, 0.08);
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
        --text-primary: #fafafa;
        --text-secondary: #e4e4e7;
        --text-muted: #a1a1aa;
        --title-gradient: linear-gradient(135deg, #fafafa 40%, #a78bfa 100%);
        --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --accent-primary: #a78bfa;
        --accent-primary-soft: rgba(167, 139, 250, 0.14);
        --accent-primary-glow: rgba(167, 139, 250, 0.35);
        --accent-secondary: #34d399;
        --accent-secondary-soft: rgba(52, 211, 153, 0.14);
        --accent-tertiary: #f472b6;
        --accent-warning: #fbbf24;
        --accent-danger: #fb7185;
        --node-fill: #18181b;
        --cable-idle: #3f3f46;
        --caption-bg: transparent;
        --caption-text: #fafafa;
        --caption-active: #a78bfa;
        --caption-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
        --caption-glow: 0 0 16px #a78bfa;
        /* Tokens estructurales de Diseño Macro y Layout */
        --radius-lg: 28px;
        --radius-md: 16px;
        --radius-sm: 999px;
        --border-width: 1px;
        --panel-backdrop: blur(24px);
        --badge-radius: 999px;
        --stage-padding: 80px 100px;
        --stage-gap: 40px;
        --split-columns: 1fr 1fr;
        --header-align: left;
        --caption-bottom: 220px;
        --caption-size: 52px;
        /* Alias de compatibilidad con plantillas existentes */
        --card: var(--surface);
        --card-bg: var(--surface);
        --panel-bg: var(--surface);
        --border-color: var(--border);
        --card-border: var(--border);
        --panel-border: var(--border);
        --text: var(--text-primary);
        --text-sub: var(--text-muted);
        --text-code: var(--text-secondary);
        --cyan: var(--accent-primary);
        --cyan-glow: var(--accent-primary-glow);
        --green: var(--accent-secondary);
        --purple: var(--accent-tertiary);
        --gold: var(--accent-warning);
        --red: var(--accent-danger);
      }
      /* @theme:end */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        font-family: var(--font-sans);
        color: var(--text-primary);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      /* Video de Cámara de Fondo */
      #bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Tarjeta Flotante (Lower-Third) */
      .lower-third {
        position: absolute;
        bottom: 80px;
        left: 80px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 6px solid var(--accent-primary);
        border-radius: 12px;
        padding: 24px 36px;
        backdrop-filter: blur(16px);
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(30px);
      }
      .lower-third h3 {
        font-size: 30px;
        font-weight: 800;
        margin-bottom: 6px;
        color: var(--text-primary);
      }
      .lower-third p {
        font-size: 16px;
        color: var(--text-muted);
      }
      /* Subtítulos Cinéticos Centrados */
      .caption-bar {
        position: absolute;
        bottom: 220px;
        width: 100%;
        text-align: center;
        font-size: 52px;
        font-weight: 900;
        text-shadow: var(--caption-shadow);
      }
      /* @caption-style:start */
      /* Caption Style: highlight_pill */
      .caption-phrase {
        display: inline-block;
        background: var(--caption-bg);
        padding: 6px 18px;
        border-radius: var(--radius-md, 12px);
      }
      .word {
        display: inline-block;
        opacity: 0.45;
        color: var(--caption-text);
        margin: 0 4px;
      }
      .word.active {
        opacity: 1;
        color: var(--caption-active);
        background: var(--accent-primary-soft);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm, 8px);
        padding: 2px 10px;
        text-shadow: none;
      }
      /* @caption-style:end */
      /* @design-system:start */
      /* Macro Design: cinematic | Layout: standard | Chrome: hidden */
      .panel, #main-card, #main-window, .node-glass {
        border-radius: var(--radius-lg);
        border: var(--border-width) solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: var(--panel-backdrop);
      }
      .badge, .hook-badge, .sys-badge, .term-badge {
        border-radius: var(--badge-radius);
      }
      .split-stage {
        grid-template-columns: var(--split-columns);
        gap: var(--stage-gap);
      }
      .caption-bar {
        bottom: var(--caption-bottom);
        font-size: var(--caption-size);
      }
      .panel, #main-card, #main-window {
        border-left: 6px solid var(--accent-primary);
      }
      .lower-third {
        left: 80px;
        right: auto;
        border-radius: var(--radius-md);
      }
      .window-header, .win-bar, .code-header {
        display: none;
      }
      /* @design-system:end */
    
      /* Capa ambiental de profundidad y volumen luminoso */
      .ambient-lights {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }
      .light-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.55;
        mix-blend-mode: screen;
      }
      .orb-primary {
        width: 650px;
        height: 650px;
        background: radial-gradient(circle, var(--accent-primary-glow) 0%, transparent 70%);
        top: -100px;
        left: -100px;
      }
      .orb-secondary {
        width: 700px;
        height: 700px;
        background: radial-gradient(circle, var(--accent-secondary-soft) 0%, transparent 70%);
        bottom: -150px;
        right: -100px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-hold
      data-motion="smooth"
      data-layout="standard"
      data-design="cinematic"
      data-style="dark_violet"
      data-caption-style="highlight_pill"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <!-- Capa ambiental de profundidad luminosa -->
      <div class="ambient-lights" data-layout-ignore>
        <div class="light-orb orb-primary" id="orb-p"></div>
        <div class="light-orb orb-secondary" id="orb-s"></div>
      </div>

      <!-- Reemplazar 'cut.mp4' con el video del presentador -->
      <video id="bg-video" src="cut.mp4" data-start="0" data-duration="15" muted></video>

      <!-- Tarjeta Lower-Third -->
      <div id="card" class="lower-third">
        <h3 id="card-title">Concepto Principal</h3>
        <p id="card-desc" data-layout-ignore>Explicación clave sincronizada con el habla</p>
      </div>

      <!-- Subtítulos Cinéticos -->
      <!-- @captions:start -->
      <div id="captions-container" class="caption-bar">
        <div id="cg_0" class="caption-phrase">
          <span id="w1" class="word">Bienvenidos</span>
          <span id="w2" class="word">a</span>
          <span id="w3" class="word">la</span>
          <span id="w4" class="word">sesión</span>
        </div>
      </div>
      <!-- @captions:end -->
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Animación de entrada y salida de la tarjeta lower-third
      tl.to("#card", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.5);
      tl.to("#card", { opacity: 0, y: 20, duration: 0.4, ease: "power2.in" }, 5.5);

      // @captions-gsap:start
      // Sincronización palabra por palabra con marcas de tiempo
      tl.to("#w1", { className: "word active", duration: 0.05 }, 1.0);
      tl.to("#w2", { className: "word active", duration: 0.05 }, 1.3);
      tl.to("#w3", { className: "word active", duration: 0.05 }, 1.5);
      tl.to("#w4", { className: "word active", duration: 0.05 }, 1.8);
      // @captions-gsap:end

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
