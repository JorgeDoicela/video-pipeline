<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    />
    <style>
      /* @theme:start */
      /* Design: editorial | Theme: paper_warm | Layout: standard */
      :root {
        --design-slug: "editorial";
        --theme-slug: "paper_warm";
        --layout-slug: "standard";
        --bg: #f5f1ea;
        --bg-gradient: radial-gradient(circle at 50% 18%, rgba(186, 147, 89, 0.14) 0%, transparent 68%);
        --surface: rgba(255, 253, 249, 0.94);
        --surface-elevated: #ebe4d8;
        --border: rgba(135, 92, 34, 0.20);
        --border-strong: rgba(135, 92, 34, 0.50);
        --divider: rgba(43, 35, 29, 0.10);
        --shadow: 0 20px 48px rgba(43, 35, 29, 0.08);
        --text-primary: #2b231d;
        --text-secondary: #4a3f35;
        --text-muted: #63564b;
        --title-gradient: linear-gradient(135deg, #2b231d 42%, #875c22 100%);
        --font-display: 'Poppins', 'Inter', sans-serif;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --accent-primary: #875c22;
        --accent-primary-soft: rgba(135, 92, 34, 0.10);
        --accent-primary-glow: rgba(186, 147, 89, 0.28);
        --accent-secondary: #3b6147;
        --accent-secondary-soft: rgba(59, 97, 71, 0.10);
        --accent-tertiary: #7c4d3a;
        --accent-warning: #8f5410;
        --accent-danger: #a32f2f;
        --node-fill: #fffdf9;
        --cable-idle: #b8aa96;
        --caption-bg: transparent;
        --caption-text: #2b231d;
        --caption-active: #875c22;
        --caption-shadow: 0 2px 10px rgba(43, 35, 29, 0.12);
        --caption-glow: none;
        /* Tokens estructurales de Diseño Macro y Layout */
        --radius-lg: 20px;
        --radius-md: 14px;
        --radius-sm: 8px;
        --border-width: 1px;
        --panel-backdrop: blur(16px);
        --stage-padding: 80px 100px;
        --stage-gap: 40px;
        --split-columns: 1fr 1fr;
        --header-align: left;
        --caption-bottom: 220px;
        --caption-size: 52px;
        /* Alias de compatibilidad con plantillas existentes */
        --card: var(--surface);
        --card-bg: var(--surface);
        --panel-bg: var(--surface);
        --border-color: var(--border);
        --card-border: var(--border);
        --panel-border: var(--border);
        --text: var(--text-primary);
        --text-sub: var(--text-muted);
        --text-code: var(--text-secondary);
        --cyan: var(--accent-primary);
        --cyan-glow: var(--accent-primary-glow);
        --green: var(--accent-secondary);
        --purple: var(--accent-tertiary);
        --gold: var(--accent-warning);
        --red: var(--accent-danger);
      }
      /* @theme:end */

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: var(--bg);
        font-family: var(--font-sans);
        color: var(--text-primary);
        position: relative;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: var(--bg);
        background-image: var(--bg-gradient);
      }

      header {
        position: absolute;
        top: 240px;
        left: 80px;
        right: 80px;
        text-align: center;
      }

      .hook-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: transparent;
        border: none;
        padding: 0;
        color: var(--accent-primary);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .main-title {
        font-size: 48px;
        font-weight: 800;
        line-height: 1.2;
        color: var(--text-primary);
      }

      #main-card {
        position: absolute;
        top: 520px;
        left: 80px;
        right: 120px;
        background: var(--surface);
        padding: 56px 48px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .quote-mark {
        font-size: 64px;
        line-height: 1;
        color: var(--accent-primary);
        font-weight: 900;
      }

      .quote-text {
        font-size: 40px;
        line-height: 1.45;
        font-weight: 600;
        color: var(--text-primary);
      }

      .quote-ref {
        font-size: 28px;
        font-weight: 700;
        color: var(--accent-primary);
        letter-spacing: 0.04em;
        font-style: normal;
      }

      .quote-note {
        font-size: 28px;
        line-height: 1.45;
        color: var(--text-secondary);
        border-top: 1px solid var(--divider);
        padding-top: 24px;
      }

      #caption-zone {
        position: absolute;
        top: 1380px;
        left: 80px;
        right: 120px;
        min-height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .caption-bar {
        font-size: 42px;
        font-weight: 800;
        line-height: 1.3;
        color: var(--caption-text);
        text-shadow: var(--caption-shadow);
      }

      .safe-footer {
        position: absolute;
        bottom: 110px;
        left: 80px;
        right: 80px;
        text-align: center;
        font-size: 20px;
        color: var(--text-muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      /* @caption-style:start */
      /* Caption Style: minimal_clean */
      .caption-phrase {
        display: inline-block;
        background: transparent;
        padding: 0;
        border: none;
      }
      .word {
        display: inline-block;
        opacity: 0.4;
        color: var(--caption-text);
        margin: 0 4px;
      }
      .word.active {
        opacity: 1;
        color: var(--caption-active);
        text-shadow: var(--caption-shadow);
      }
      .word.word-emphasis.active {
        color: var(--accent-secondary);
        opacity: 1;
        background: transparent;
        border: none;
        padding: 0;
        text-shadow: 0 0 28px var(--accent-primary-glow), 0 4px 16px rgba(0, 0, 0, 0.72);
      }
      /* @caption-style:end */
      /* @design-system:start */
      /* Macro Design: editorial | Layout: standard */
      h1, h2, .main-title, .scene-headline, .ng-quote-text, .quote-text {
        font-family: var(--font-display);
      }
      .panel, #main-card {
        border-radius: var(--radius-lg);
        border: var(--border-width) solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: var(--panel-backdrop);
      }
      .badge, .hook-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: transparent;
        border: none;
        padding: 0;
        color: var(--accent-primary);
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .badge svg, .hook-badge svg {
        background: transparent;
        border: none;
        padding: 0;
      }
      .split-stage {
        grid-template-columns: var(--split-columns);
        gap: var(--stage-gap);
      }
      .caption-bar {
        bottom: var(--caption-bottom);
        font-size: var(--caption-size);
      }
      .panel, #main-card {
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .lower-third {
        left: 80px;
        right: auto;
        border: var(--border-width) solid var(--border);
        border-radius: var(--radius-md);
      }
      /* @design-system:end */
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-design="editorial"
      data-style="paper_warm"
      data-layout="standard"
      data-motion="minimal"
      data-caption-style="minimal_clean"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <header id="header">
        <div class="hook-badge" data-layout-ignore>Lectura y Reflexión</div>
        <h1 id="card-title" class="main-title">Sabiduría y Propósito</h1>
      </header>

      <div id="main-card">
        <div class="quote-mark" data-layout-ignore>&ldquo;</div>
        <blockquote class="quote-text">
          Lámpara es a mis pies tu palabra, y lumbrera a mi camino.
        </blockquote>
        <cite class="quote-ref">Salmos 119:105</cite>
        <p class="quote-note">
          Una guía clara para tomar decisiones con serenidad, criterio y dirección firme.
        </p>
      </div>

      <div id="caption-zone">
        <!-- @captions:start -->
        <div id="captions-container" class="caption-bar">
          <div id="cg_0" class="caption-phrase">
            <span id="w1" class="word">Lámpara</span>
            <span id="w2" class="word">es</span>
            <span id="w3" class="word">a</span>
            <span id="w4" class="word">mis</span>
            <span id="w5" class="word">pies</span>
          </div>
        </div>
        <!-- @captions:end -->
      </div>

      <div class="safe-footer" data-layout-ignore>
        Guarda esta reflexión para tu día
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.from("#header", { opacity: 0, y: -20, duration: 0.35, ease: "power1.out" }, 0.0);
      tl.from("#main-card", { opacity: 0, y: 24, duration: 0.35, ease: "power1.out" }, 0.25);
      tl.from(".quote-ref", { opacity: 0, y: 12, duration: 0.5, ease: "power2.out" }, 3.2);
      tl.from(".quote-note", { opacity: 0, y: 14, duration: 0.6, ease: "power2.out" }, 5.6);
      tl.from(".safe-footer", { opacity: 0, y: 10, duration: 0.5, ease: "power2.out" }, 8.0);

      // @captions-gsap:start
      tl.to("#w1", { className: "word active", duration: 0.05 }, 1.0);
      tl.to("#w2", { className: "word active", duration: 0.05 }, 1.4);
      tl.to("#w3", { className: "word active", duration: 0.05 }, 1.7);
      tl.to("#w4", { className: "word active", duration: 0.05 }, 2.0);
      tl.to("#w5", { className: "word active", duration: 0.05 }, 2.4);
      // @captions-gsap:end

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
