<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Explainer Multi-Escena 16:9</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* @theme:start */
      /* Design: cinematic | Theme: dark_violet | Layout: standard */
      :root {
        --design-slug: "cinematic";
        --theme-slug: "dark_violet";
        --layout-slug: "standard";
        --bg: #09090b;
        --bg-gradient: radial-gradient(circle at 50% 20%, rgba(167, 139, 250, 0.14) 0%, transparent 70%);
        --surface: rgba(24, 24, 27, 0.90);
        --surface-elevated: rgba(255, 255, 255, 0.04);
        --border: rgba(167, 139, 250, 0.26);
        --border-strong: rgba(167, 139, 250, 0.65);
        --divider: rgba(255, 255, 255, 0.08);
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
        --text-primary: #fafafa;
        --text-secondary: #e4e4e7;
        --text-muted: #a1a1aa;
        --title-gradient: linear-gradient(135deg, #fafafa 40%, #a78bfa 100%);
        --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --accent-primary: #a78bfa;
        --accent-primary-soft: rgba(167, 139, 250, 0.14);
        --accent-primary-glow: rgba(167, 139, 250, 0.35);
        --accent-secondary: #34d399;
        --accent-secondary-soft: rgba(52, 211, 153, 0.14);
        --accent-tertiary: #f472b6;
        --accent-warning: #fbbf24;
        --accent-danger: #fb7185;
        --node-fill: #18181b;
        --cable-idle: #3f3f46;
        --caption-bg: transparent;
        --caption-text: #fafafa;
        --caption-active: #a78bfa;
        --caption-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
        --caption-glow: 0 0 16px #a78bfa;
        --radius-lg: 28px;
        --radius-md: 16px;
        --radius-sm: 999px;
        --border-width: 1px;
        --panel-backdrop: blur(24px);
        --badge-radius: 0px;
        --stage-padding: 64px 120px;
        --stage-gap: 36px;
        --split-columns: 1fr 1fr;
        --header-align: center;
        --caption-bottom: 64px;
        --caption-size: 46px;
      }
      /* @theme:end */

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: var(--bg);
        font-family: var(--font-sans);
        color: var(--text-primary);
        position: relative;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: var(--bg);
        overflow: hidden;
      }

      .atmosphere-bg {
        position: absolute;
        inset: 0;
        background: var(--bg-gradient);
        pointer-events: none;
      }

      #atmosphere-rays {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2400px;
        height: 2400px;
        margin-left: -1200px;
        margin-top: -1200px;
        background: repeating-conic-gradient(
          from 0deg,
          var(--accent-primary-soft) 0deg 10deg,
          transparent 10deg 24deg
        );
        opacity: 0.28;
        pointer-events: none;
        display: none;
      }
      #atmosphere-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, var(--divider) 1px, transparent 1px),
          linear-gradient(to bottom, var(--divider) 1px, transparent 1px);
        background-size: 72px 72px;
        pointer-events: none;
        display: none;
      }
      #root[data-atmosphere="sunburst"] #atmosphere-rays,
      #root:not([data-atmosphere]) #atmosphere-rays {
        display: block;
      }
      #root[data-atmosphere="grid"] #atmosphere-grid {
        display: block;
      }

      #progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: var(--accent-primary);
        transform-origin: left center;
        z-index: 40;
      }

      #scenes-stage {
        position: absolute;
        inset: 0;
        padding: 72px 140px 180px 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      .scene-node {
        position: absolute;
        inset: 72px 140px 180px 140px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
      }

      .scene-header {
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .hook-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: transparent;
        border: none;
        padding: 0;
        color: var(--accent-primary);
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .scene-headline {
        font-size: 58px;
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        text-transform: uppercase;
        text-shadow: 0 6px 28px var(--accent-primary-glow);
      }

      .scene-body {
        width: 100%;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Componentes SVG/HTML limpios */
      .ng-timeline {
        width: 100%;
        max-width: 1360px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
      }
      .ng-tl-item {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 36px 32px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        text-align: left;
      }
      .ng-tl-item.ng-tl-highlight {
        border: 2px solid var(--accent-primary);
      }
      .ng-tl-marker {
        font-family: var(--font-mono);
        font-size: 28px;
        font-weight: 800;
        color: var(--accent-primary);
      }
      .ng-tl-title {
        font-size: 34px;
        font-weight: 800;
        color: var(--text-primary);
      }
      .ng-tl-detail {
        font-size: 28px;
        line-height: 1.35;
        color: var(--text-muted);
      }

      .ng-compare {
        width: 100%;
        max-width: 1320px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
      }
      .ng-cmp-col {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 40px 38px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        text-align: left;
      }
      .ng-cmp-col.ng-cmp-accent {
        border: 2px solid var(--accent-secondary);
      }
      .ng-cmp-title {
        font-size: 36px;
        font-weight: 900;
        color: var(--text-primary);
      }
      .ng-cmp-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 16px;
        font-size: 28px;
        line-height: 1.35;
        color: var(--text-secondary);
      }

      .ng-quote-card {
        width: 100%;
        max-width: 1200px;
        padding: 52px 64px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 28px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .ng-quote-mark {
        font-size: 76px;
        line-height: 0.75;
        font-weight: 900;
        color: var(--accent-primary);
      }
      .ng-quote-text {
        font-size: 42px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--text-primary);
      }
      .ng-quote-author {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent-primary);
      }
      .ng-quote-ctx {
        font-size: 28px;
        color: var(--text-muted);
      }

      .ng-bars {
        width: 100%;
        max-width: 1120px;
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding: 44px 48px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
      }
      .ng-bar-row { display: flex; flex-direction: column; gap: 10px; }
      .ng-bar-head {
        display: flex;
        justify-content: space-between;
        font-size: 30px;
        font-weight: 700;
        color: var(--text-primary);
      }
      .ng-bar-track {
        width: 100%;
        height: 26px;
        background: var(--surface-elevated);
        border-radius: 13px;
        overflow: hidden;
      }
      .ng-bar-fill {
        height: 100%;
        background: var(--accent-primary);
        border-radius: 13px;
      }
      .ng-bar-highlight .ng-bar-fill { background: var(--accent-secondary); }

      .ng-code-card {
        width: 100%;
        max-width: 1180px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 36px 40px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        text-align: left;
      }
      .ng-code-lang {
        font-family: var(--font-mono);
        font-size: 28px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--accent-primary);
      }
      .ng-code-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-family: var(--font-mono);
        font-size: 28px;
        line-height: 1.4;
      }
      .ng-code-line {
        display: flex;
        gap: 18px;
        padding: 8px 14px;
        border-radius: 10px;
        color: var(--text-muted);
      }
      .ng-code-line-active {
        background: var(--accent-primary-soft);
        color: var(--text-primary);
        font-weight: 700;
      }
      .ng-code-num { color: var(--text-muted); min-width: 32px; }

      .ng-stat-card {
        width: 100%;
        max-width: 900px;
        padding: 56px 48px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: 32px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .ng-stat-val { font-size: 112px; font-weight: 900; color: var(--accent-primary); line-height: 1; }
      .ng-stat-lbl { font-size: 38px; font-weight: 800; color: var(--text-primary); }
      .ng-stat-note { font-size: 28px; color: var(--text-muted); }
      .ng-spotlight {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
      }
      .ng-spot-ring {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ng-ring-svg { position: absolute; inset: 0; }
      .ng-spot-icon { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; }
      .ng-spot-label { font-size: 40px; font-weight: 900; color: var(--text-primary); }
      .ng-spot-sub { font-size: 28px; color: var(--text-muted); max-width: 820px; }

      /* Subtítulos Cinéticos */
      #caption-zone {
        position: absolute;
        left: 120px;
        right: 120px;
        bottom: var(--caption-bottom);
        display: flex;
        justify-content: center;
        z-index: 30;
        pointer-events: none;
      }

      /* @caption-style:start */
      .caption-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        font-size: var(--caption-size);
        font-weight: 900;
        text-align: center;
        line-height: 1.25;
      }
      .word {
        opacity: 0.4;
        color: var(--caption-text);
        margin: 0 4px;
      }
      .word.active {
        opacity: 1;
        color: var(--caption-active);
        text-shadow: var(--caption-shadow);
      }
      /* @caption-style:end */

      /* @design-system:start */
      /* Macro Design: cinematic | Layout: standard | Chrome: hidden */
      .panel, #main-card {
        border-radius: var(--radius-lg);
        border: var(--border-width) solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: var(--panel-backdrop);
      }
      .badge, .hook-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: transparent;
        border: none;
        padding: 0;
        color: var(--accent-primary);
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .badge svg, .hook-badge svg {
        background: transparent;
        border: none;
        padding: 0;
      }
      .caption-bar {
        bottom: var(--caption-bottom);
        font-size: var(--caption-size);
      }
      .window-header { display: none; }
      /* @design-system:end */
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-caption-style="minimal_clean"
      data-motion="snappy"
      data-start="0"
      data-duration="12.00"
      data-width="1920"
      data-height="1080"
    >
      <div class="atmosphere-bg" data-layout-ignore></div>
      <div id="atmosphere-rays" data-layout-ignore></div>
      <div id="atmosphere-grid" data-layout-ignore></div>
      <div id="progress-bar" data-layout-ignore></div>

      <!-- @scenes:start -->
      <div id="scenes-stage"></div>
      <!-- @scenes:end -->

      <div id="caption-zone">
        <!-- @captions:start -->
        <div id="captions-container" class="caption-bar">
          <div id="cg_0" class="caption-phrase">
            <span id="cw_0_0" class="word active">Narrativa</span>
            <span id="cw_0_1" class="word">multi-escena</span>
            <span id="cw_0_2" class="word">16:9</span>
          </div>
        </div>
        <!-- @captions:end -->
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // @scenes-gsap:start
      // @scenes-gsap:end

      // @captions-gsap:start
      // @captions-gsap:end

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
