<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* @theme:start */
      /* Design: cyber_glass | Theme: cyber_dark | Layout: standard */
      :root {
        --design-slug: "cyber_glass";
        --theme-slug: "cyber_dark";
        --layout-slug: "standard";
        --bg: #070b14;
        --bg-gradient: radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
        --surface: rgba(16, 23, 42, 0.88);
        --surface-elevated: rgba(255, 255, 255, 0.03);
        --border: rgba(56, 189, 248, 0.25);
        --border-strong: rgba(56, 189, 248, 0.65);
        --divider: rgba(255, 255, 255, 0.08);
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --title-gradient: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
        --font-sans: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --accent-primary: #38bdf8;
        --accent-primary-soft: rgba(56, 189, 248, 0.12);
        --accent-primary-glow: rgba(56, 189, 248, 0.35);
        --accent-secondary: #10b981;
        --accent-secondary-soft: rgba(16, 185, 129, 0.12);
        --accent-tertiary: #c084fc;
        --accent-warning: #fbbf24;
        --accent-danger: #f43f5e;
        --node-fill: #10172a;
        --cable-idle: #1e293b;
        --caption-bg: transparent;
        --caption-text: #f8fafc;
        --caption-active: #38bdf8;
        --caption-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
        --caption-glow: 0 0 16px #38bdf8;
        /* Tokens estructurales de Diseño Macro y Layout */
        --radius-lg: 18px;
        --radius-md: 12px;
        --radius-sm: 6px;
        --border-width: 1px;
        --panel-backdrop: blur(20px);
        --badge-radius: 6px;
        --stage-padding: 80px 100px;
        --stage-gap: 40px;
        --split-columns: 1fr 1fr;
        --header-align: left;
        --caption-bottom: 220px;
        --caption-size: 52px;
        /* Alias de compatibilidad con plantillas existentes */
        --card: var(--surface);
        --card-bg: var(--surface);
        --panel-bg: var(--surface);
        --border-color: var(--border);
        --card-border: var(--border);
        --panel-border: var(--border);
        --text: var(--text-primary);
        --text-sub: var(--text-muted);
        --text-code: var(--text-secondary);
        --cyan: var(--accent-primary);
        --cyan-glow: var(--accent-primary-glow);
        --green: var(--accent-secondary);
        --purple: var(--accent-tertiary);
        --gold: var(--accent-warning);
        --red: var(--accent-danger);
      }
      /* @theme:end */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        font-family: var(--font-sans);
        color: var(--text-primary);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        padding: 60px 100px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: var(--bg-gradient), var(--bg);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        background: var(--accent-primary-soft);
        border: 1px solid var(--border);
        color: var(--accent-primary);
        font-size: 13px;
        font-weight: 800;
        border-radius: 6px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 40px;
        font-weight: 900;
        letter-spacing: -0.02em;
        color: var(--text-primary);
      }
      .diagram-stage {
        flex: 1;
        position: relative;
        margin: 30px 0;
      }
      footer {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: var(--text-muted);
        border-top: 1px solid var(--divider);
        padding-top: 20px;
      }
      /* @design-system:start */
      /* Macro Design: cyber_glass | Layout: standard | Chrome: macos_dots */
      .panel, #main-card, #main-window, .node-glass {
        border-radius: var(--radius-lg);
        border: var(--border-width) solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: var(--panel-backdrop);
      }
      .badge, .hook-badge, .sys-badge, .term-badge {
        border-radius: var(--badge-radius);
      }
      .split-stage {
        grid-template-columns: var(--split-columns);
        gap: var(--stage-gap);
      }
      .caption-bar {
        bottom: var(--caption-bottom);
        font-size: var(--caption-size);
      }
      .lower-third {
        left: 80px;
        right: auto;
        border-radius: var(--radius-md);
      }
      /* @design-system:end */
          /* @caption-style:start */
      /* Caption Style: karaoke_glow */
      .caption-phrase {
        display: inline-block;
        background: var(--caption-bg);
        padding: 6px 18px;
        border-radius: var(--radius-md, 12px);
      }
      .word {
        display: inline-block;
        opacity: 0.25;
        color: var(--caption-text);
        margin: 0 4px;
      }
      .word.active {
        opacity: 1;
        color: var(--caption-active);
        text-shadow: var(--caption-glow);
      }
      /* @caption-style:end */
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-caption-style="karaoke_glow"
      data-hold
      data-motion="dynamic"
      data-layout="standard"
      data-design="cyber_glass"
      data-style="cyber_dark"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <header id="header">
        <div>
          <div class="badge" data-layout-ignore>Tech Explainer Starter</div>
          <h1>Topología de Infraestructura</h1>
        </div>
        <div style="font-size:14px; color:var(--text-muted); text-align:right;" data-layout-ignore>
          <span style="color:var(--accent-secondary); font-weight:700;">Status: Ready</span>
        </div>
      </header>

      <div class="diagram-stage">
        <svg width="100%" height="100%" viewBox="0 0 1720 600" style="position:absolute; top:0; left:0;">
          <line id="cable" x1="300" y1="300" x2="1420" y2="300" style="stroke: var(--cable-idle);" stroke-width="4" stroke-dasharray="8 8"/>
          <circle id="packet" cx="300" cy="300" r="10" style="fill: var(--accent-primary);" opacity="0"/>

          <!-- Nodo Origen -->
          <g id="node-a" transform="translate(140, 230)">
            <rect width="260" height="140" rx="14" style="fill: var(--node-fill); stroke: var(--accent-primary);" stroke-width="2"/>
            <text x="130" y="75" style="fill: var(--text-primary);" font-size="28" font-weight="800" text-anchor="middle">Componente A</text>
            <text x="130" y="108" style="fill: var(--text-muted);" font-size="14" text-anchor="middle" data-layout-ignore>Origen de Datos</text>
          </g>

          <!-- Nodo Destino -->
          <g id="node-b" transform="translate(1320, 230)">
            <rect width="260" height="140" rx="14" style="fill: var(--node-fill); stroke: var(--accent-secondary);" stroke-width="2"/>
            <text x="130" y="75" style="fill: var(--text-primary);" font-size="28" font-weight="800" text-anchor="middle">Componente B</text>
            <text x="130" y="108" style="fill: var(--text-muted);" font-size="14" text-anchor="middle" data-layout-ignore>Destino Procesado</text>
          </g>
        </svg>
      </div>

      <footer id="footer" data-layout-ignore>
        <span>Plantilla de Explicador Técnico</span>
        <span>HyperFrames + GSAP + SVG</span>
      </footer>
    </div>

    <script>
      const rootStyles = getComputedStyle(document.documentElement);
      const accentPrimary = rootStyles.getPropertyValue("--accent-primary").trim() || "#38bdf8";
      const cableIdle = rootStyles.getPropertyValue("--cable-idle").trim() || "#1e293b";

      const tl = gsap.timeline({ paused: true });
      tl.from("#header", { y: -16, duration: 0.8, ease: "power3.out" }, 0.0);
      tl.from("#node-a, #node-b", { opacity: 0, scale: 0.9, stagger: 0.2, duration: 0.8, ease: "back.out(1.5)" }, 0.3);
      tl.from("#cable", { opacity: 0, duration: 0.6 }, 0.7);

      // Animación de paquete de datos
      tl.set("#packet", { opacity: 1 }, 1.5);
      tl.fromTo("#packet", { cx: 300 }, { cx: 1420, duration: 1.5, ease: "power2.inOut" }, 1.5);
      tl.to("#cable", { stroke: accentPrimary, duration: 0.3 }, 1.5);
      tl.to("#cable", { stroke: cableIdle, duration: 0.5 }, 2.8);
      tl.set("#packet", { opacity: 0 }, 3.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
