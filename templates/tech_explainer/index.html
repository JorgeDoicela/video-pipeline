<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #070b14;
        --card: rgba(16, 23, 42, 0.88);
        --cyan: #38bdf8;
        --green: #10b981;
        --border: rgba(56, 189, 248, 0.25);
        --text: #f8fafc;
        --text-sub: #94a3b8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        font-family: 'JetBrains Mono', -apple-system, sans-serif;
        color: var(--text);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        padding: 60px 100px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid var(--border);
        color: var(--cyan);
        font-size: 13px;
        font-weight: 800;
        border-radius: 6px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      h1 { font-size: 40px; font-weight: 900; letter-spacing: -0.02em; }
      .diagram-stage {
        flex: 1;
        position: relative;
        margin: 30px 0;
      }
      footer {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: var(--text-sub);
        border-top: 1px solid rgba(255,255,255,0.08);
        padding-top: 20px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <header id="header">
        <div>
          <div class="badge">Tech Explainer Starter</div>
          <h1>Topología de Infraestructura</h1>
        </div>
        <div style="font-size:14px; color:var(--text-sub); text-align:right;">
          <span style="color:var(--green); font-weight:700;">Status: Ready</span>
        </div>
      </header>

      <div class="diagram-stage">
        <svg width="100%" height="100%" viewBox="0 0 1720 600" style="position:absolute; top:0; left:0;">
          <line id="cable" x1="300" y1="300" x2="1420" y2="300" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8"/>
          <circle id="packet" cx="300" cy="300" r="10" fill="#38bdf8" opacity="0"/>

          <!-- Nodo Origen -->
          <g id="node-a" transform="translate(140, 230)">
            <rect width="220" height="140" rx="14" fill="#10172a" stroke="#38bdf8" stroke-width="2"/>
            <text x="110" y="75" fill="#f8fafc" font-size="20" font-weight="800" text-anchor="middle">Componente A</text>
            <text x="110" y="105" fill="#94a3b8" font-size="13" text-anchor="middle">Origen de Datos</text>
          </g>

          <!-- Nodo Destino -->
          <g id="node-b" transform="translate(1360, 230)">
            <rect width="220" height="140" rx="14" fill="#10172a" stroke="#10b981" stroke-width="2"/>
            <text x="110" y="75" fill="#f8fafc" font-size="20" font-weight="800" text-anchor="middle">Componente B</text>
            <text x="110" y="105" fill="#94a3b8" font-size="13" text-anchor="middle">Destino Procesado</text>
          </g>
        </svg>
      </div>

      <footer id="footer">
        <span>Plantilla de Explicador Técnico</span>
        <span>HyperFrames + GSAP + SVG</span>
      </footer>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#header", { opacity: 0, y: -20, duration: 0.8, ease: "power2.out" }, 0.2);
      tl.from("#node-a, #node-b", { opacity: 0, scale: 0.9, stagger: 0.2, duration: 0.8, ease: "back.out(1.5)" }, 0.4);
      tl.from("#cable", { opacity: 0, duration: 0.6 }, 0.8);

      // Animación de paquete de datos
      tl.set("#packet", { opacity: 1 }, 1.5);
      tl.fromTo("#packet", { cx: 300 }, { cx: 1420, duration: 1.5, ease: "power2.inOut" }, 1.5);
      tl.to("#cable", { stroke: "#38bdf8", duration: 0.3 }, 1.5);
      tl.to("#cable", { stroke: "#1e293b", duration: 0.5 }, 2.8);
      tl.set("#packet", { opacity: 0 }, 3.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
