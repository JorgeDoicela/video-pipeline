<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --cyan: #38bdf8;
        --card-bg: rgba(15, 23, 42, 0.9);
        --border: rgba(56, 189, 248, 0.3);
        --text: #f8fafc;
        --text-sub: #94a3b8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font-family: 'JetBrains Mono', -apple-system, sans-serif;
        color: var(--text);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      /* Video de Cámara de Fondo */
      #bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Tarjeta Flotante (Lower-Third) */
      .lower-third {
        position: absolute;
        bottom: 80px;
        left: 80px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-left: 6px solid var(--cyan);
        border-radius: 12px;
        padding: 24px 36px;
        backdrop-filter: blur(16px);
        box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        opacity: 0;
        transform: translateY(30px);
      }
      .lower-third h3 {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 6px;
        color: var(--text);
      }
      .lower-third p {
        font-size: 16px;
        color: var(--text-sub);
      }
      /* Subtítulos Cinéticos Centrados */
      .caption-bar {
        position: absolute;
        bottom: 220px;
        width: 100%;
        text-align: center;
        font-size: 52px;
        font-weight: 900;
        text-shadow: 0 4px 20px rgba(0,0,0,0.9);
      }
      .word {
        opacity: 0.25;
      }
      .word.active {
        opacity: 1;
        color: var(--cyan);
        text-shadow: 0 0 16px var(--cyan);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <!-- Reemplazar 'cut.mp4' con el video del presentador -->
      <video id="bg-video" src="cut.mp4" data-start="0" data-duration="15" muted></video>

      <!-- Tarjeta Lower-Third -->
      <div id="card" class="lower-third">
        <h3 id="card-title">Concepto Principal</h3>
        <p id="card-desc">Explicación clave sincronizada con el habla</p>
      </div>

      <!-- Subtítulos Cinéticos -->
      <div class="caption-bar">
        <span id="w1" class="word">Bienvenidos</span>
        <span id="w2" class="word">a</span>
        <span id="w3" class="word">la</span>
        <span id="w4" class="word">sesión</span>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Animación de entrada y salida de la tarjeta lower-third
      tl.to("#card", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.5);
      tl.to("#card", { opacity: 0, y: 20, duration: 0.4, ease: "power2.in" }, 5.5);

      // Sincronización palabra por palabra con marcas de tiempo
      tl.to("#w1", { className: "word active", duration: 0.05 }, 1.0);
      tl.to("#w2", { className: "word active", duration: 0.05 }, 1.3);
      tl.to("#w3", { className: "word active", duration: 0.05 }, 1.5);
      tl.to("#w4", { className: "word active", duration: 0.05 }, 1.8);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
