[project]
name = "video-pipeline"
version = "1.0.0"
description = "Pipeline local de video programático con IA"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jorge Doicela" }
]
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.5",
    "av==13.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # Line too long (manejado por el formateador)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

