name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    name: Python Lint, Format and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python ruff pytest
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Check code formatting (Ruff)
        run: .venv/bin/ruff format --check core tests

      - name: Lint codebase (Ruff)
        run: .venv/bin/ruff check core tests

      - name: Run unit tests (pytest)
        run: .venv/bin/pytest tests

  template-quality:
    name: HyperFrames Templates Lint & Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome Headless Shell
        run: pnpm exec hyperframes browser ensure

      - name: Validate Templates
        run: |
          pnpm exec hyperframes check templates/landscape_16_9
          pnpm exec hyperframes check templates/portrait_9_16
          pnpm exec hyperframes check templates/square_1_1
          pnpm exec hyperframes check templates/talking_head
          pnpm exec hyperframes check templates/tech_explainer
